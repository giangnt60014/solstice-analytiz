<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#7c6af7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c6af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sungrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6355d8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a1020"/>
  <!-- Ambient glow -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>

  <!-- Horizon line -->
  <line x1="4" y1="21" x2="28" y2="21" stroke="rgba(124,106,247,0.35)" stroke-width="1" stroke-linecap="round"/>

  <!-- Rising sun arc -->
  <path d="M8.5 21 A7.5 7.5 0 0 1 23.5 21Z" fill="url(#sungrad)"/>

  <!-- Rays -->
  <line x1="16" y1="7"   x2="16" y2="11"  stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="7"  y1="13"  x2="9.7" y2="15.3" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="13"  x2="22.3" y2="15.3" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="3.5" y1="21" x2="6.5" y2="21" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28.5" y1="21" x2="25.5" y2="21" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
</svg>
